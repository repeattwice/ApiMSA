syntax = "proto3";

package user;

option go_package = "./user_pb";

service UserService {
    rpc CreateAccount (CreateAccountRequest) returns (CreateAccountResponse);
    rpc Avtorization (AvtorizationRequest) returns (AvtorizationResponse);
    rpc GetCart(GetCartRequest) returns (GetCartResponse);
    rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse);
}

message CreateAccountRequest {
    string user_name = 1;
    string last_name = 2;
    string email = 3;
}

message CreateAccountResponse {
    bool succes = 1;
}

message AvtorizationRequest {
    string user_name = 1;
    string last_name = 2;
    string email = 3;
}

message AvtorizationResponse {
    bool is_user_exists = 1;
    bool is_lact_name_is_correct = 2;
}

message GetCartRequest {
    int32 user_id = 1;
}

message CartItem {
    string item_name = 1;
    int32 item_price = 2;
}

message GetCartResponse {
    repeated CartItem items = 1;
}

message DeleteAccountRequest {
    string user_name = 1;
    string last_name = 2;
}

message DeleteAccountResponse {
    bool succes = 1;
}
