services:
  postgres:
    image: postgres:16-alpine
    container_name: forerp-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: forerp-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  bdservice:
    image: golang:1.25
    container_name: forerp-bdservice
    working_dir: /app/BDservice
    volumes:
      - ./:/app
      - go_pkg_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKERS: kafka:9092
    command: sh -c "go mod download && go run ."
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5051:5051"
    restart: unless-stopped

  apiservice:
    image: golang:1.25
    container_name: forerp-apiservice
    working_dir: /app/ApiService
    volumes:
      - ./:/app
      - go_pkg_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      GRPC_ADDR: bdservice:5051
      KAFKA_BROKERS: kafka:9092
    command: sh -c "go mod download && go run . --port 8080"
    depends_on:
      - bdservice
      - kafka
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  go_pkg_cache:
  go_build_cache:
